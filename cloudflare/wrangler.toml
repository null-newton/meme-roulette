name = "meme-roulette-api"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://meme.zacsvae.com,http://meme.zacsvae.com,http://localhost:8080"

# Create with: npx wrangler kv namespace create STATS   (then paste the id below)
[[kv_namespaces]]
binding = "STATS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (never commit these): npx wrangler secret put TURN_KEY_ID / TURN_KEY_API_TOKEN / SUMMARY_TOKEN
